<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>QBot</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#232b36;--fg:#e6edf3;--dim:#8b949e;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;padding:26px 16px 40px}
.hero{text-align:center;margin:14px 0 22px}
.logo{width:66px;height:66px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(135deg,#1f6feb,#3fb950);display:flex;align-items:center;justify-content:center;font-size:33px;font-weight:800;color:#fff;box-shadow:0 8px 24px rgba(31,111,235,.35)}
h1{font-size:26px;margin:0;letter-spacing:2px}
.hero p{color:var(--dim);font-size:13px;margin:5px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card.ok{border-color:#1f6f3d}
.row{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:0 0 auto}
.dim{color:var(--dim);font-size:12.5px;margin:8px 0 0}
b{font-size:15px}
.steps{margin-top:12px}
.step{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--dim)}
.step:last-child{border-bottom:none}
.step span{width:23px;height:23px;border-radius:50%;background:#1c2430;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.step.done{color:var(--fg)}
.step.done span{background:#16351f;border-color:#238636;color:var(--ok)}
.step.active{color:var(--fg)}
.step.active span{background:#1f2a3a;border-color:#1f6feb;color:#58a6ff}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#16351f;color:var(--ok);border:1px solid #238636;margin-left:auto}
.foot{text-align:center;color:#4d5661;font-size:11.5px;margin-top:26px}
</style>
</head>
<body>

<div class="hero">
  <div class="logo">Q</div>
  <h1>QBot</h1>
  <p>Android 上的 QQ 机器人</p>
</div>

<div class="card ok">
  <div class="row">
    <span class="dot"></span>
    <b>构建链路已打通</b>
  </div>
  <p class="dim">你现在看到的界面，是从 GitHub Actions 云编译出的 APK 里跑起来的。环境、签名、打包——全通了。</p>
</div>

<div class="card">
  <div class="row">
    <b>安装向导</b>
    <span class="tag">开发中</span>
  </div>
  <div class="steps">
    <div class="step done"><span>1</span>应用骨架</div>
    <div class="step active"><span>2</span>下载 Linux 根文件系统（约 150MB）</div>
    <div class="step"><span>3</span>下载并安装 QQ</div>
    <div class="step"><span>4</span>部署 NapCat 与插件系统</div>
    <div class="step"><span>5</span>启动机器人</div>
  </div>
  <p class="dim">QQ 安装包不会放进本仓库托管，而是由 App 在运行时自动测速、从多个源里挑最快的下载。</p>
</div>

<div class="card">
  <b>设计目标</b>
  <p class="dim">单个 APK 搞定一切，不需要 Termux，不需要敲命令。装上去，点几下，机器人就活了。</p>
</div>

<div class="foot">QBot v0.1.0 · 基于 NapCat</div>

</body>
</html>
